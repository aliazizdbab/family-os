<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src https://*.firebaseio.com; object-src 'none'; base-uri 'self';"
    />
    <title>أداة تصدير بيانات مقاضي العائلة (النسخة القديمة)</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #f3f6f8;
        color: #0f172a;
        margin: 0;
        padding: 1.2rem;
      }
      .box {
        max-width: 38rem;
        margin: auto;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 1.2rem;
        padding: 1.2rem;
      }
      h1 {
        font-size: 1.2rem;
        margin: 0 0 0.5rem;
      }
      .mu {
        color: #64748b;
        font-size: 0.85rem;
      }
      input,
      button,
      textarea {
        font: inherit;
        width: 100%;
        box-sizing: border-box;
        padding: 0.65rem 0.85rem;
        border-radius: 0.8rem;
        margin: 0.35rem 0;
      }
      input,
      textarea {
        border: 1px solid #cbd5e1;
        background: #f8fafc;
      }
      button {
        border: 0;
        background: #0f766e;
        color: #fff;
        font-weight: 700;
        cursor: pointer;
        min-height: 44px;
      }
      button.sec {
        background: #e2e8f0;
        color: #0f172a;
      }
      .stat {
        background: #f1f5f9;
        border-radius: 0.8rem;
        padding: 0.75rem;
        margin: 0.6rem 0;
        font-size: 0.9rem;
      }
      #toast {
        margin-top: 0.5rem;
        font-weight: 700;
        color: #0f766e;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>📤 أداة تصدير بيانات النسخة القديمة (Legacy Export)</h1>
      <p class="mu">
        تقرأ هذه الأداة بيانات القائمة فقط وتُزيل تلقائياً رموز PIN المشفّرة (salt/hash) ولا تقرأ أو
        تصدّر أي مفاتيح AI.
      </p>

      <button id="btn-local" type="button">
        1️⃣ قراءة من المتصفح الحالي (localStorage: fl_shared)
      </button>

      <hr />
      <label class="mu" for="rtdb-url">أو الجلب المباشر (للقراءة فقط) من Firebase RTDB:</label>
      <input
        id="rtdb-url"
        dir="ltr"
        value="https://family-requests-9e431-default-rtdb.firebaseio.com"
        placeholder="https://xxx-default-rtdb.firebaseio.com"
      />
      <input id="rtdb-room" dir="ltr" value="family" placeholder="اسم الغرفة (family)" />
      <button id="btn-rtdb" type="button" class="sec">2️⃣ جلب من Firebase (مسار /rooms فقط)</button>

      <hr />
      <label class="mu" for="file-in"
        >أو اختيار ملف <code>family-backup.json</code> جاهز لتنظيفه:</label
      >
      <input id="file-in" type="file" accept="application/json,.json" />

      <div id="preview" class="stat" hidden></div>
      <button id="btn-dl" type="button" hidden>
        💾 تنزيل ملف التصدير النظيف (legacy-export-v1.json)
      </button>
      <div id="toast" role="status"></div>
    </div>
    <script type="module" src="./export-legacy.js"></script>
  </body>
</html>
