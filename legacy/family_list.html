<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>مقاضي العائلة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ac:#0f766e;--bg:#f3f6f8;--cd:#fff;--tx:#0f172a;--mu:#64748b;--bd:#e2e8f0;--fs:16px}
:root[data-theme=dark]{--bg:#0b1220;--cd:#141d30;--tx:#e8edf6;--mu:#93a1b8;--bd:#25314a}
*{box-sizing:border-box}html{font-size:var(--fs)}
body{margin:0;font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:5rem}
button,input,select{font:inherit;color:inherit}
.ov{position:fixed;inset:0;background:linear-gradient(160deg,var(--ac),#0b1220);z-index:9;display:flex;align-items:center;justify-content:center;padding:1rem;overflow:auto}
.box{background:var(--cd);border-radius:1.5rem;padding:1.4rem;width:100%;max-width:26rem;box-shadow:0 20px 50px #0006}
h1,h2,h3{margin:0}.mu{color:var(--mu);font-size:.8rem}
input,select{width:100%;padding:.7rem .9rem;border:1.5px solid var(--bd);border-radius:.9rem;background:var(--bg);margin:.3rem 0}
input:focus,select:focus{outline:2px solid var(--ac)}
.b{border:0;border-radius:.9rem;padding:.65rem 1rem;background:var(--ac);color:#fff;font-weight:700;cursor:pointer}
.b.g{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}.b.r{background:#e11d48}.b.s{padding:.3rem .6rem;font-size:.8rem}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin:.7rem 0}
.chip{padding:.5rem .9rem;border-radius:2rem;border:2px solid var(--bd);background:var(--bg);cursor:pointer;font-weight:700}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
header{background:linear-gradient(135deg,var(--ac),#0b1220);color:#fff;padding:1.2rem 1rem 1.6rem;border-radius:0 0 2rem 2rem}
.w{max-width:44rem;margin:auto}.row{display:flex;align-items:center;justify-content:space-between;gap:.6rem}
.card{background:var(--cd);border-radius:1.2rem;border:1px solid var(--bd);margin:.8rem 0;overflow:hidden}
.ch{padding:.7rem 1rem;font-weight:800;display:flex;justify-content:space-between;background:color-mix(in srgb,var(--ac) 10%,transparent)}
.it{padding:.7rem 1rem;border-top:1px solid var(--bd);display:flex;gap:.7rem;align-items:flex-start}
.ck{width:1.7rem;height:1.7rem;border-radius:.6rem;border:2px solid var(--mu);flex:none;display:grid;place-items:center;cursor:pointer;background:none;color:#fff}
.ck.on{background:var(--ac);border-color:var(--ac)}
.dn .nm{text-decoration:line-through;color:var(--mu)}
.tag{font-size:.68rem;background:var(--bg);padding:.1rem .5rem;border-radius:1rem;color:var(--mu);margin-inline-end:.3rem;display:inline-block;margin-top:.2rem}
.u{background:#ffe4e6;color:#be123c}
nav{position:fixed;bottom:0;inset-inline:0;background:var(--cd);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:.7rem;font-weight:700;color:var(--mu);cursor:pointer}
nav button.on{color:var(--ac)}
.sw{width:2.2rem;height:2.2rem;border-radius:50%;border:3px solid transparent;cursor:pointer}
.sw.on{border-color:var(--tx)}
.bar{height:.5rem;background:#fff3;border-radius:1rem;overflow:hidden;margin-top:.5rem}.bar i{display:block;height:100%;background:#fcd34d;transition:.4s}
#toast{position:fixed;bottom:5rem;inset-inline:1rem;max-width:24rem;margin:auto;background:#0f172a;color:#fff;padding:.7rem 1rem;border-radius:1rem;z-index:20;display:none;text-align:center;font-weight:700}
.p{padding:0 .9rem}.sec{padding:1rem;background:var(--cd);border:1px solid var(--bd);border-radius:1.2rem;margin:.8rem 0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
[hidden]{display:none!important}
.mg{max-width:88%;padding:.6rem .9rem;border-radius:1.1rem;margin:.4rem 0;white-space:pre-wrap;line-height:1.6;background:var(--cd);border:1px solid var(--bd)}.mg.me{background:var(--ac);color:#fff;margin-inline-start:auto;border-color:var(--ac)}
</style></head><body>
<div id="lock" class="ov"></div>
<div id="app" hidden>
<header><div class="w"><div class="row"><div><div class="mu" style="color:#fffb">أهلاً بك</div><h1 id="hi"></h1></div>
<svg width="64" height="64" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" fill="none" stroke="#fff3" stroke-width="4"/><circle id="rg" cx="18" cy="18" r="15" fill="none" stroke="#fcd34d" stroke-width="4" stroke-linecap="round" stroke-dasharray="0 94" transform="rotate(-90 18 18)"/><text id="rt" x="18" y="22" text-anchor="middle" fill="#fff" font-size="9" font-weight="800"></text></svg></div>
<div class="row" style="margin-top:.7rem"><span id="bt"></span><span id="bs" class="mu" style="color:#fffc"></span></div><div class="bar"><i id="bb"></i></div></div></header>
<div class="w p" id="main"></div>
<nav><button data-a="tab" data-v="list">🛒 القائمة</button><button data-a="tab" data-v="log">🕒 السجل</button><button data-a="tab" data-v="ai">🤖 المساعد</button><button data-a="tab" data-v="set">⚙️ تخصيص</button></nav>
</div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CATS=[['laundry','🧺','المغسلة'],['appliances','🔌','صيانة الأجهزة'],['car','🔧','السيارة'],['herbs','🌿','العطّار'],['pharmacy','💊','الصيدلية'],['super','🏪','السوبرماركت'],['produce','🥬','الخضّار'],['bakery','🥖','المخبز'],['butcher','🥩','القصّاب (آخراً ❄️)']];
const COLORS=['#0f766e','#2563eb','#7c3aed','#db2777','#ea580c','#16a34a','#0891b2','#475569'];
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}},st=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(k==='fl_local'?{...v,ai:undefined}:v))}catch{}};
let L=Object.assign({ac:COLORS[0],dark:false,fs:16,url:'',room:'family',uid:''},ld('fl_local',{}));
let S=Object.assign({items:[],members:[],budget:250,log:[],t:0},ld('fl_shared',{}));
let me=null,tab='list',filter='all',fails=0,lockUntil=0,pick=null,dirty=0,idle=Date.now(),pt;
const now=()=>new Date().toLocaleString('ar',{dateStyle:'short',timeStyle:'short'});
const rid=()=>Math.random().toString(36).slice(2,9);
const norm=()=>{['items','members','log','cats'].forEach(k=>{S[k]=Array.isArray(S[k])?S[k].filter(Boolean):Object.values(S[k]||{})});syncCats()};
async function H(p,salt){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch{return btoa(salt+p)}}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3200)}
function theme(){const r=document.documentElement;r.style.setProperty('--ac',L.ac);r.style.setProperty('--fs',L.fs+'px');r.dataset.theme=L.dark?'dark':'';$('meta[name=theme-color]').content=L.ac}
function save(){S.t=Date.now();st('fl_shared',S);st('fl_local',L);clearTimeout(pt);pt=setTimeout(push,600)}
const url=()=>L.url.replace(/\/+$/,'')+'/rooms/'+encodeURIComponent(L.room)+'.json';
async function push(){if(!L.url)return;try{await fetch(url(),{method:'PUT',body:JSON.stringify(S)})}catch{}}
async function pull(){if(!L.url)return true;try{const r=await fetch(url()+'?t='+Date.now());if(!r.ok)return false;const d=await r.json();
if(d&&d.t>S.t){['items','members','log'].forEach(k=>{if(d[k]==null)d[k]=[]});S=Object.assign(S,d);norm();st('fl_shared',S);
if(me){if(!S.members.find(m=>m.id===me.id)){logout();return true}me=S.members.find(m=>m.id===me.id);document.activeElement&&/INPUT|SELECT/.test(document.activeElement.tagName)?dirty=1:render()}
else if(!$('#lock').hidden&&S.members.length&&!/INPUT/.test((document.activeElement||{}).tagName||''))showLock()}return true}catch{return false}}
function log(a,n){S.log.unshift({w:me?me.name:'النظام',a,n,t:now()});S.log=S.log.slice(0,60)}
const adm=()=>me&&me.admin;
/* ---------- Lock screen ---------- */
function showLock(){$('#app').hidden=true;const el=$('#lock');el.hidden=false;
if(!S.members.length){el.innerHTML=`<div class="box"><h2>🔐 إعداد أول مرة</h2><p class="mu">أنشئ حساب المسؤول. لا توجد رموز افتراضية، والرمز يُخزَّن مشفّراً (SHA-256).</p><input id="n" placeholder="اسمك"><input id="p1" type="password" inputmode="numeric" maxlength="8" placeholder="رمز PIN (4–8 أرقام)"><input id="p2" type="password" inputmode="numeric" maxlength="8" placeholder="أعد كتابة الرمز"><button class="b" style="width:100%;margin-top:.5rem" data-a="setup">إنشاء وبدء</button><p class="mu" style="margin:.8rem 0 0">لديك قائمة على Firebase؟ ادخل الإعدادات بعد الدخول.</p></div>`;return}
if(!pick||!S.members.find(m=>m.id===pick))pick=S.members[0].id;
el.innerHTML=`<div class="box"><h2>🛒 مقاضي العائلة</h2><p class="mu">اختر اسمك ثم أدخل رمزك</p><div class="chips">${S.members.map(m=>`<button class="chip ${m.id===pick?'on':''}" data-a="pick" data-v="${esc(m.id)}">${esc(m.icon)} ${esc(m.name)}</button>`).join('')}</div><input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="رمز PIN" autocomplete="off"><label class="mu"><input type="checkbox" id="rem" style="width:auto;margin:0 0 0 .4rem"> تذكرني على هذا الجهاز</label><button class="b" style="width:100%;margin-top:.6rem" data-a="login">دخول</button></div>`}
async function setup(){const n=$('#n').value.trim(),a=$('#p1').value,b=$('#p2').value;
if(!n||!/^\d{4,8}$/.test(a))return toast('اكتب الاسم ورمزاً من 4 إلى 8 أرقام');if(a!==b)return toast('الرمزان غير متطابقين');
if(['1234','0000','1111','12345678'].includes(a))return toast('الرمز ضعيف جداً، اختر غيره');
const salt=rid()+rid();S.members.push({id:rid(),name:n,icon:'🛡️',admin:true,salt,hash:await H(a,salt)});log('إنشاء النظام','');save();enter(S.members[0],true)}
async function login(){if(Date.now()<lockUntil)return toast('مقفل مؤقتاً، انتظر '+Math.ceil((lockUntil-Date.now())/1000)+' ثانية');
const m=S.members.find(x=>x.id===pick);if(!m)return;if(m.off)return toast('الحساب مجمّد');
if(await H($('#pin').value,m.salt)===m.hash){fails=0;enter(m,$('#rem').checked)}else{fails++;if(fails>=3){lockUntil=Date.now()+30000*fails;toast('3 محاولات خاطئة: قفل '+30*fails+' ثانية');log('محاولات دخول فاشلة',m.name);save()}else toast('رمز خاطئ ('+fails+'/3)')}}
function enter(m,remember){pullAI();me=m;if(remember){L.uid=m.id;st('fl_local',L)}$('#lock').hidden=true;$('#app').hidden=false;idle=Date.now();render();toast('مرحباً '+m.name+' 👋')}
function logout(){CH=[];st('fl_chat',[]);me=null;L.uid='';st('fl_local',L);pick=null;showLock()}
/* ---------- Render ---------- */
function render(){dirty=0;if(!me)return showLock();theme();
const tot=S.items.length,dn=S.items.filter(i=>i.dn).length,pc=tot?Math.round(dn/tot*100):0,est=S.items.reduce((s,i)=>s+(+i.p||0),0),paid=S.items.filter(i=>i.dn).reduce((s,i)=>s+(+i.p||0),0);
$('#hi').textContent=me.icon+' '+me.name;$('#rg').setAttribute('stroke-dasharray',(pc*.94)+' 94');$('#rt').textContent=pc+'%';
$('#bt').textContent=`الإجمالي ${est} د.ل · مدفوع ${paid}`;$('#bs').textContent=S.budget?(est>S.budget?'⚠️ تجاوز '+(est-S.budget):'متبقي '+(S.budget-est)):'';$('#bb').style.width=Math.min(100,S.budget?est/S.budget*100:0)+'%';
document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===tab));
$('#main').innerHTML=tab==='list'?vList():tab==='log'?vLog():tab==='ai'?vChat():vSet();if(tab==='ai'){const c=$('#cb');c&&(c.scrollTop=c.scrollHeight)}}
function row(i){const ct=CATS.find(c=>c[0]===i.c)||[],e='style="padding:.35rem .6rem;margin:0;font-size:.85rem"',v=esc(i.id);return `<div class="it ${i.dn?'dn':''}" data-n="${esc(String(i.n).toLowerCase())}"><button class="ck ${i.dn?'on':''}" data-a="tg" data-v="${v}">${i.dn?'✓':''}</button><div style="flex:1"><div class="nm"><b>${esc(i.n)}</b> ${i.u&&!i.dn?'<span class="tag u">ضروري</span>':''}</div><div class="g2" style="margin:.3rem 0"><input data-f="q" data-v="${v}" value="${esc(i.q)}" placeholder="الكمية" ${e}><input data-f="p" data-v="${v}" type="number" inputmode="decimal" min="0" step="any" value="${+i.p||''}" placeholder="السعر د.ل" ${e}></div><span class="tag">📝 ${esc(i.by)}</span>${i.dn?`<span class="tag">${ct[1]||''} ${esc(ct[2]||'')}</span><span class="tag">✅ ${esc(i.dnBy)} · ${esc(i.dnAt)}</span>`:i.cl?`<span class="tag">✋ ${esc(i.cl)}</span>`:''}</div><div style="display:flex;flex-direction:column;gap:.3rem">${i.dn?'':`<button class="b g s" data-a="cl" data-v="${v}">${i.cl===me.name?'إلغاء ✋':'✋ سأحضره'}</button>`}<div style="display:flex;gap:.3rem"><button class="b g s" data-a="edit" data-v="${v}">✏️</button>${adm()||i.by===me.name?`<button class="b g s" data-a="del" data-v="${v}">🗑️</button>`:''}</div></div></div>`}
let showDone=0,showAdd=0;
function vList(){const f=i=>filter==='done'?i.dn:filter==='urg'?(i.u&&!i.dn):!i.dn;
let h=`<div class="chips">${[['all','المتبقي'],['urg','🔥 ضروري'],['done','المنجز']].map(x=>`<button class="chip ${filter===x[0]||(x[0]==='all'&&filter==='todo')?'on':''}" data-a="flt" data-v="${x[0]}">${x[1]}</button>`).join('')}<button class="chip" data-a="call">${allC()?'⏬ فتح الكل':'⏫ طي الكل'}</button></div><input id="sq" placeholder="🔍 بحث في القائمة">`+(showAdd?`<div class="sec"><div class="g2"><input id="an" placeholder="اسم الغرض"><input id="aq" placeholder="الكمية"></div><div class="g2"><select id="ac">${CATS.map(c=>`<option value="${c[0]}">${c[1]} ${c[2]}</option>`).join('')}</select><input id="ap" type="number" min="0" placeholder="السعر د.ل"></div><div class="row"><label><input type="checkbox" id="au" style="width:auto;margin:0 0 0 .3rem">ضروري 🔥</label><span><button class="b g" data-a="tadd">إغلاق</button> <button class="b" data-a="add">+ إضافة</button></span></div></div>`:`<button class="b" style="width:100%;margin:.4rem 0" data-a="tadd">+ إضافة غرض</button>`);
CATS.forEach(c=>{const all=S.items.filter(i=>i.c===c[0]);const its=all.filter(f);if(!its.length)return;
const cl=L.cc.includes(c[0]),id=esc(c[0]);h+=`<div class="card"><div class="ch"><span data-a="tcat" data-v="${id}" style="cursor:pointer;flex:1">${cl?'◀':'▼'} ${c[1]} ${c[2]}</span><span class="mu">${all.filter(i=>i.dn).length}/${all.length}${adm()&&filter!=='done'?` <button class="b g s" data-a="lmv" data-v="${id}:-1">↑</button> <button class="b g s" data-a="lmv" data-v="${id}:1">↓</button>`:''}</span></div>`+(cl?'':its.map(row).join(''))+'</div>'});
if(!S.items.some(i=>!i.dn)&&filter!=='done')h+='<p class="mu" style="text-align:center;margin:2rem">لا توجد أغراض متبقية 🎉</p>';
const dl=S.items.filter(i=>i.dn);
if(dl.length&&filter!=='done')h+=`<div class="card"><div class="ch" data-a="tdone" style="cursor:pointer"><span>✅ المنجزة (${dl.length})</span><span>${showDone?'▲':'▼'}</span></div>${showDone?dl.map(row).join('')+(adm()?'<div style="padding:.6rem 1rem"><button class="b r s" data-a="cdone">🧹 مسح كل المنجزة</button></div>':''):''}</div>`;
return h+`<button class="b" style="width:100%;margin:.5rem 0" data-a="wa">📲 مشاركة التقرير على واتساب</button>`}
function vLog(){return `<div class="card">${S.log.map(l=>`<div class="it"><div style="flex:1"><b>${esc(l.w)}</b> ${esc(l.a)} <b>${esc(l.n)}</b></div><span class="mu">${esc(l.t)}</span></div>`).join('')||'<p class="mu" style="padding:1rem">لا حركات بعد</p>'}</div>`}
function vSet(){let h=`<div class="sec"><h3>🎨 تخصيص المظهر (لجهازك فقط)</h3><div class="chips">${COLORS.map(c=>`<button class="sw ${L.ac===c?'on':''}" style="background:${c}" data-a="col" data-v="${c}"></button>`).join('')}</div>
<div class="row"><span>🌙 الوضع الداكن</span><button class="b g s" data-a="dark">${L.dark?'مفعّل':'متوقف'}</button></div>
<label class="mu">حجم الخط: ${L.fs}px</label><input type="range" id="fs" min="14" max="20" value="${L.fs}" style="padding:0"></div>
<div class="sec"><h3>🔑 تغيير رمزي</h3><input id="op" type="password" inputmode="numeric" maxlength="8" placeholder="الرمز الحالي"><input id="np" type="password" inputmode="numeric" maxlength="8" placeholder="رمز جديد (4–8 أرقام)"><button class="b" data-a="chpin">حفظ</button></div>`;
if(adm())h+=`<div class="sec"><h3>🛡️ إدارة العائلة</h3>${S.members.map(m=>`<div class="row" style="margin:.5rem 0"><span>${esc(m.icon)} ${esc(m.name)} ${m.admin?'🛡️':''}${m.off?' 🚫':''}</span><span style="display:flex;gap:.3rem"><button class="b g s" data-a="rpin" data-v="${esc(m.id)}">رمز</button>${m.id!==me.id?`<button class="b g s" data-a="adm" data-v="${esc(m.id)}">${m.admin?'سحب':'ترقية'}</button><button class="b g s" data-a="off" data-v="${esc(m.id)}">${m.off?'تفعيل':'تجميد'}</button><button class="b r s" data-a="rm" data-v="${esc(m.id)}">✕</button>`:''}</span></div>`).join('')}
<div class="g2"><input id="mn" placeholder="اسم عضو جديد"><select id="mi"><option>🚗</option><option>🏠</option><option>❤️</option><option>👦</option><option>👧</option></select></div><input id="mp" type="password" inputmode="numeric" maxlength="8" placeholder="رمز PIN للعضو"><button class="b" data-a="addm">+ إضافة عضو</button>
<hr style="border:0;border-top:1px solid var(--bd);margin:1rem 0"><label class="mu">سقف الميزانية (د.ل)</label><input id="bud" type="number" value="${+S.budget||0}"></div>
${vCats()}${vAI()}<div class="sec"><h3>☁️ المزامنة (Firebase)</h3><input id="fu" dir="ltr" placeholder="https://xxx-default-rtdb.firebaseio.com" value="${esc(L.url)}"><input id="fr" dir="ltr" placeholder="اسم الغرفة" value="${esc(L.room)}"><button class="b" data-a="sync">حفظ وتفعيل</button> <button class="b g" data-a="exp">نسخة احتياطية</button><p class="mu">المزامنة تعمل عند استضافة الملف على موقعك. أمّن قواعد Firebase (Rules).</p></div>`;
return h+`<div class="sec row"><button class="b g" data-a="lockn">🔒 قفل الآن</button><button class="b r" data-a="out">🚪 خروج</button></div>`}
/* ---------- Actions ---------- */
const A={
tab:v=>{tab=v},flt:v=>{filter=v},pick:v=>{pick=v;showLock();return 1},setup,login,
add(){const n=$('#an').value.trim();if(!n)return toast('اكتب اسم الغرض');S.items.push({id:rid(),n,q:$('#aq').value.trim(),p:+$('#ap').value||0,c:$('#ac').value,u:$('#au').checked,by:me.name,dn:0,cl:''});log('أضاف',n);save()},
async tg(v){const i=S.items.find(x=>x.id===v);if(!i)return;if(i.dn&&i.dnBy!==me.name&&!await ask('أنجزه '+i.dnBy+'. إلغاء الإنجاز؟'))return 1;i.dn=!i.dn;i.dnBy=i.dn?me.name:'';i.dnAt=i.dn?now():'';log(i.dn?'أنجز':'ألغى إنجاز',i.n);save()},

d.innerHTML=`<div class="box"><h3>✏️ تعديل الغرض</h3><input id="eN" value="${esc(i.n)}" placeholder="الاسم"><div class="g2"><input id="eQ" value="${esc(i.q)}" placeholder="الكمية"><input id="eP" type="number" min="0" value="${+i.p||''}" placeholder="السعر"></div><select id="eC">${CATS.map(c=>`<option value="${c[0]}" ${c[0]===i.c?'selected':''}>${c[1]} ${c[2]}</option>`).join('')}</select><label><input type="checkbox" id="eU" ${i.u?'checked':''} style="width:auto;margin:0 0 0 .3rem">ضروري 🔥</label><div class="row" style="margin-top:.7rem"><button class="b g" id="eX">إلغاء</button><button class="b" id="eS">حفظ</button></div></div>`;
document.body.appendChild(d);const q=x=>d.querySelector(x);q('#eX').onclick=()=>d.remove();
q('#eS').onclick=()=>{const n=q('#eN').value.trim();if(!n)return;const c=q('#eC').value;if(c!==i.c)log('نقل إلى '+CATS.find(k=>k[0]===c)[2],n);else log('عدّل',n);i.n=n;i.q=q('#eQ').value.trim();i.p=+q('#eP').value||0;i.c=c;i.u=q('#eU').checked;save();d.remove();render()}}
Object.assign(A,{edit(v){const i=S.items.find(x=>x.id===v);if(i)editDlg(i);return 1},tadd(){showAdd=!showAdd},tdone(){showDone=!showDone},
async cdone(){if(!adm()||!await ask('مسح كل الأغراض المنجزة نهائياً؟'))return 1;S.items=S.items.filter(i=>!i.dn);log('مسح المنجز','');save()},retry(){location.reload();return 1}});
document.addEventListener('input',e=>{if(e.target.id==='sq'){const v=e.target.value.trim().toLowerCase();document.querySelectorAll('#main .it[data-n]').forEach(r=>r.hidden=!!v&&!r.dataset.n.includes(v));document.querySelectorAll('#main .card').forEach(c=>c.hidden=!!v&&!c.querySelector('.it[data-n]:not([hidden])'))}});
const aiUrl=()=>L.url.replace(/\/+$/,'')+'/ai/'+encodeURIComponent(L.room)+'.json';
async function pushAI(){if(!L.url||!adm())return false;try{return(await fetch(aiUrl(),{method:'PUT',body:JSON.stringify({t:Date.now(),on:L.ai.on,ps:L.ai.ps})})).ok}catch{return false}}
async function pullAI(){if(!L.url)return;try{const r=await fetch(aiUrl()+'?t='+Date.now());if(!r.ok)return;const d=await r.json();
if(d&&Array.isArray(d.ps)&&d.ps.length){d.ps.forEach(p=>{p.ml=p.ml||[];p.key=p.key||''});L.ai={on:d.on||'',ed:L.ai.ed,ps:d.ps};if(me&&!/INPUT|SELECT/.test((document.activeElement||{}).tagName||''))render()}}catch{}}
function syncCats(){if(!S.cats.length)S.cats=CATS.map(c=>({id:c[0],i:c[1],n:c[2]}));else CATS.splice(0,CATS.length,...S.cats.map(c=>[c.id,c.i,c.n]))}
function totals(){const est=S.items.reduce((a,i)=>a+(+i.p||0),0),paid=S.items.filter(i=>i.dn).reduce((a,i)=>a+(+i.p||0),0);$('#bt').textContent=`الإجمالي ${est} د.ل · مدفوع ${paid}`;$('#bs').textContent=S.budget?(est>S.budget?'⚠️ تجاوز '+(est-S.budget):'متبقي '+(S.budget-est)):'';$('#bb').style.width=Math.min(100,S.budget?est/S.budget*100:0)+'%'}
function vCats(){if(!adm())return'';return `<div class="sec"><h3>🗂️ الأقسام</h3>${S.cats.map((c,k)=>`<div class="row" style="margin:.4rem 0"><span>${esc(c.i)} ${esc(c.n)} <span class="mu">(${S.items.filter(i=>i.c===c.id).length})</span></span><span style="display:flex;gap:.3rem"><button class="b g s" data-a="cup" data-v="${k}">↑</button><button class="b g s" data-a="cdn" data-v="${k}">↓</button><button class="b g s" data-a="cedit" data-v="${esc(c.id)}">✏️</button><button class="b r s" data-a="cdel" data-v="${esc(c.id)}">✕</button></span></div>`).join('')}<button class="b" data-a="cadd">+ قسم جديد</button></div>`}
function catDlg(c){const d=document.createElement('div');d.className='ov';d.style.zIndex=30;d.style.background='#0009';
d.innerHTML=`<div class="box"><h3>${c?'✏️ تعديل القسم':'➕ قسم جديد'}</h3><div class="g2"><input id="kI" value="${esc(c?c.i:'🛒')}" placeholder="رمز (إيموجي)" maxlength="4"><input id="kN" value="${esc(c?c.n:'')}" placeholder="اسم القسم"></div><div class="row" style="margin-top:.7rem"><button class="b g" id="kX">إلغاء</button><button class="b" id="kS">حفظ</button></div></div>`;
document.body.appendChild(d);const q=x=>d.querySelector(x);q('#kX').onclick=()=>d.remove();
q('#kS').onclick=()=>{const n=q('#kN').value.trim().slice(0,30),ic=q('#kI').value.trim()||'🛒';if(!n)return;if(c){c.n=n;c.i=ic;log('عدّل قسم',n)}else{S.cats.push({id:rid(),i:ic,n});log('أضاف قسم',n)}syncCats();save();d.remove();render()}}
const mvCat=(k,d)=>{const j=k+d;if(j<0||j>=S.cats.length)return;[S.cats[k],S.cats[j]]=[S.cats[j],S.cats[k]];syncCats();save()};
Object.assign(A,{cadd(){catDlg(null);return 1},cedit(v){const c=S.cats.find(x=>x.id===v);if(c)catDlg(c);return 1},cup(v){mvCat(+v,-1)},cdn(v){mvCat(+v,1)},
async cdel(v){const c=S.cats.find(x=>x.id===v);if(!c||!adm())return 1;if(S.cats.length<2){toast('لا بد من بقاء قسم واحد على الأقل');return 1}const to=S.cats.find(x=>x.id!==v),n=S.items.filter(i=>i.c===v);
if(!await ask('حذف قسم "'+c.n+'"؟'+(n.length?'\nسيُنقل '+n.length+' غرض إلى "'+to.n+'"':'')))return 1;n.forEach(i=>i.c=to.id);S.cats=S.cats.filter(x=>x!==c);log('حذف قسم',c.n);syncCats();save()}});
document.addEventListener('change',e=>{const t=e.target,f=t.dataset&&t.dataset.f;if(!f)return;const i=S.items.find(x=>x.id===t.dataset.v);if(!i)return;idle=Date.now();if(f==='p')i.p=Math.max(0,+t.value||0);else i.q=t.value.trim().slice(0,30);save();totals()});
L.cc=Array.isArray(L.cc)?L.cc:[];
const vis=()=>S.cats.filter(c=>S.items.some(i=>i.c===c.id&&(filter==='done'?i.dn:filter==='urg'?(i.u&&!i.dn):!i.dn))),allC=()=>vis().length>0&&vis().every(c=>L.cc.includes(c.id));
Object.assign(A,{tcat(v){L.cc=L.cc.includes(v)?L.cc.filter(x=>x!==v):[...L.cc,v];st('fl_local',L)},
call(){const v=vis();L.cc=allC()?[]:v.map(c=>c.id);st('fl_local',L)},
lmv(v){if(!adm())return;const[id,d]=v.split(':'),vs=vis(),o=vs[vs.findIndex(c=>c.id===id)+ +d];if(!o)return;const a=S.cats.findIndex(c=>c.id===id),b=S.cats.findIndex(c=>c.id===o.id);[S.cats[a],S.cats[b]]=[S.cats[b],S.cats[a]];syncCats();save()}});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;idle=Date.now();const f=A[b.dataset.a];if(!f)return;const r=await f(b.dataset.v);if(r!==1&&me)render()});
document.addEventListener('input',e=>{if(e.target.id==='fs'){L.fs=+e.target.value;st('fl_local',L);theme()}if(e.target.id==='bud'&&adm()){S.budget=+e.target.value||0;save()}});
document.addEventListener('focusout',()=>{setTimeout(()=>{if(dirty&&!/INPUT|SELECT/.test(document.activeElement.tagName))render()},200)});
document.addEventListener('keydown',e=>{idle=Date.now();if(e.key==='Enter'&&e.target.id==='pin')login()});
document.addEventListener('touchstart',()=>idle=Date.now(),{passive:true});
setInterval(()=>{if(me&&Date.now()-idle>5*60000){logout();toast('🔒 قُفل التطبيق تلقائياً لعدم النشاط')}},15000);
setInterval(pull,5000);
/* ---------- Init ---------- */
norm();theme();
(async()=>{let ok=true;if(L.url&&!S.members.length)ok=await Promise.race([pull(),new Promise(r=>setTimeout(()=>r(false),7000))]);
if(!ok&&!S.members.length){$('#lock').innerHTML='<div class="box"><h2>⚠️ تعذّر الاتصال بالمزامنة</h2><p class="mu">لم نستطع تحميل بيانات العائلة. تحقق من الإنترنت ثم أعد المحاولة (لن ننشئ حساباً جديداً حتى لا تُمسح البيانات).</p><button class="b" style="width:100%" data-a="retry">🔄 إعادة المحاولة</button></div>';return}
const rem=S.members.find(m=>m.id===L.uid&&!m.off);if(rem)enter(rem,true);else showLock();pull()})();
</script></body></html>
