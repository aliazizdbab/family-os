<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://www.gstatic.com/firebasejs/13.1.0/; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://www.gstatic.com https://www.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebasedatabase.app wss://*.firebasedatabase.app https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://generativelanguage.googleapis.com https://api.openai.com https://api.anthropic.com https://openrouter.ai https://api.groq.com https://api.deepseek.com http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:*; object-src 'none'; base-uri 'self'; form-action 'self';"
    />
    <title>مقاضي العائلة — Family OS</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap"
    />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <header class="header">
      <div class="w">
        <div class="row">
          <div>
            <div class="header-sub">Family OS · الإصدار التمهيدي</div>
            <h1>🛒 مقاضي العائلة</h1>
          </div>
          <div id="net-pill" class="status-pill" aria-live="polite">جارٍ التحقق...</div>
        </div>
      </div>
    </header>

    <main class="w p">
      <div id="sw-update" class="banner" hidden>
        <span>✨ يتوفر تحديث جديد للتطبيق</span>
        <button type="button" id="sw-reload" class="btn">تحديث الآن</button>
      </div>

      <div id="install-banner" class="banner" hidden>
        <span>📲 ثبّت التطبيق على جهازك للعمل دون إنترنت</span>
        <button type="button" id="install-btn" class="btn">تثبيت</button>
      </div>

      <div id="intent-banner" class="sec" hidden></div>

      <div id="view-root"></div>
    </main>

    <nav class="nav" aria-label="التنقل الرئيسي">
      <button type="button" data-tab="home" class="on">🏠 التأسيس</button>
      <button type="button" data-tab="import">📥 استيراد</button>
      <button type="button" data-tab="prefs">🎨 المظهر</button>
    </nav>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <div id="dialog-root"></div>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
